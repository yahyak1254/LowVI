name: Build LowVI EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p victory
      - uses: actions/upload-artifact@v4
        with:
          name: lowvi-windows
          path: |
            target/release/victory.exe
            victory.example.toml

